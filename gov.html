<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Oh!国 政府</title>
<link rel="stylesheet" href="ohk.css">
<style>
body{padding-bottom:20px}
main{max-width:1320px}
#s-main.screen.on{display:grid;grid-template-columns:360px 1fr;gap:0 18px;align-items:start}
.colL,.colR{min-width:0}
.wide{grid-column:1/-1}
h2.sec{margin-top:14px}
table.tb td,table.tb th{white-space:nowrap}
.tb .pill{padding:4px 10px;font-size:11px;margin:0 2px 0 0}
#rosterTbl{max-height:480px;overflow:auto}
.btnrow{display:flex;gap:8px}
.btnrow .btn{margin-top:8px}
@media(max-width:900px){#s-main.screen.on{display:block}}
</style>
</head><body>
<header><div class="ttl"><i>!</i> 政府 <span style="font-size:11px;color:#888">GOVERNMENT</span></div><div class="ph" id="hph">—</div></header>
<main>

<section class="screen on" id="s-login" style="max-width:460px;margin:40px auto">
  <div class="card">
    <h3>政府キーでログイン</h3>
    <input id="l-key" placeholder="gov-xxxxxx" autocapitalize="off">
    <button class="btn pri" onclick="login()">🏛 政府端末を開く</button>
    <p class="note">⚠️ この画面が国の進行エンジンです。イベント中は必ず1台で開きっぱなしに(フェーズ切替・給与自動振込・市場開閉・事件の開始終了はこの端末が動かします)。</p>
  </div>
</section>

<section class="screen" id="s-main">
  <div class="colL">
    <div class="card" id="dash"></div>
    <h2 class="sec">進行</h2>
    <div class="card">
      <button class="btn pri" id="openBtn" onclick="openCountry()">🏛 開国する(タイマー始動)</button>
      <div class="btnrow">
        <button class="btn dark" onclick="pause(true)">⏸ 一時停止</button>
        <button class="btn ghost" onclick="pause(false)">▶️ 再開</button>
      </div>
      <label>フェーズへジャンプ</label>
      <div class="row">
        <select id="jump"></select>
        <button class="btn mini dark" style="margin:0;padding:12px" onclick="jump()">移動</button>
      </div>
      <div class="btnrow">
        <button class="btn ghost" onclick="shiftMin(-1)">−1分</button>
        <button class="btn ghost" onclick="shiftMin(1)">＋1分</button>
        <button class="btn ghost" onclick="shiftMin(5)">＋5分</button>
      </div>
      <button class="btn ghost" id="paperBtn" onclick="paper()">📄 紙モード切替</button>
    </div>
    <h2 class="sec">キー一覧(スタッフ配布用)</h2>
    <div class="card" id="keysBox" style="font-size:12px">—</div>
    <button class="btn ghost" onclick="clearS('ohk_g');location.reload()">退出</button>
  </div>

  <div class="colR">
    <h2 class="sec" style="margin-top:0">国家事件・最終ミッション・ダービー</h2>
    <div class="card">
      <div id="rushBox"><p class="note">事件はフェーズ到達で自動開始・自動終了します(手動操作は不要)。</p></div>
      <div class="row">
        <div><label>最終ミッション:達成チーム数</label><input id="mdone" inputmode="numeric" placeholder="例: 21"></div>
        <button class="btn mini dark" style="margin:0;padding:12px" onclick="mission()">記録</button>
      </div>
      <label style="margin-top:14px">🏇 ダービー ── ① 出走馬6名(実名)を登録</label>
      <div class="row">
        <input id="e1" placeholder="A枠"><input id="e2" placeholder="B枠"><input id="e3" placeholder="C枠">
        <input id="e4" placeholder="D枠"><input id="e5" placeholder="E枠"><input id="e6" placeholder="F枠">
      </div>
      <div class="row">
        <button class="btn dark" style="margin-top:8px" onclick="derbyEntrants()">出走馬を登録</button>
        <button class="btn dark" style="margin-top:8px" onclick="derbyOpen()">② 馬券の発売開始</button>
        <button class="btn ghost" style="margin-top:8px" onclick="derbyRace()">③ 発走!(発売締切)</button>
      </div>
      <label>④ 結果の確定</label>
      <div class="row">
        <select id="d-win"></select>
        <input id="d-citizen" inputmode="numeric" placeholder="優勝者の番号">
        <button class="btn mini pri" style="margin:0;padding:12px" onclick="derbySettle()">🏁 清算</button>
      </div>
      <p class="note">清算=的中券3倍の払い戻し+優勝者に賞金1,000を国庫から一括支払い。</p>
    </div>

    <h2 class="sec">店舗の強制ステータス</h2>
    <div class="card">
      <div class="row">
        <select id="f-sel"></select>
        <select id="f-st"><option value="AUTO">自動(フェーズに従う)</option><option value="OPEN">強制OPEN</option><option value="CLOSED">強制CLOSED</option></select>
        <button class="btn mini dark" style="margin:0;padding:12px" onclick="facSt()">適用</button>
      </div>
    </div>

    <h2 class="sec">繁栄度・表彰(暫定1位)</h2>
    <div class="row" style="align-items:stretch">
      <div class="card" id="prosBox" style="flex:1">—</div>
      <div class="card" id="awardsBox" style="flex:1">—</div>
    </div>
  </div>

  <div class="wide">
    <h2 class="sec">市民名簿</h2>
    <div class="card">
      <div class="row">
        <input id="r-q" placeholder="🔍 番号・名前・部署で検索" oninput="renderRoster()">
        <button class="btn mini dark" style="margin:0;padding:12px" onclick="loadRoster()">🔄 名簿を更新</button>
      </div>
      <div id="rosterTbl" style="margin-top:10px"><p class="note">「名簿を更新」を押すと一覧が出ます</p></div>
      <label style="margin-top:14px">CSV取込(name,display_name,slack,department,role,kind,team ── kind=staffは自動除外)</label>
      <textarea id="csv" rows="3" placeholder="ここにCSVを貼る"></textarea>
      <div class="btnrow">
        <button class="btn dark" onclick="importCSV()">📥 名簿を取り込む(101〜自動付与+人生ガチャ)</button>
        <button class="btn ghost" onclick="importDummy()">🧪 ダミー148人を投入(試遊用)</button>
      </div>
    </div>
  </div>
</section>

</main>
<div id="toast"></div>
<script src="ohk.js"></script>
<script>
let KEY=null, tick=null, ROSTER=[];
const AWARD_NAMES={richest:"👑 総資産",riser:"🚀 成り上がり",investor:"📈 投資家",spender:"🛍 消費王",worker:"💪 働き者",popular:"🤝 人気者"};

async function login(){
  const k=$("l-key").value.trim(); if(!k) return toast("政府キーを入力",1);
  try{ await rpc("rpc_tick",{p_key:k}); KEY=k; saveS("ohk_g",{k}); enter(); }
  catch(e){ toast(e.message,1); }
}
async function enter(){
  $("s-login").classList.remove("on"); $("s-main").classList.add("on");
  const defs=await loadPhaseDefs();
  $("jump").innerHTML=defs.filter(d=>d.id!=="SETUP").map(d=>'<option value="'+d.id+'">'+d.label+"("+d.start_min+"分)</option>").join("");
  const fs=await tbl("facility?select=id,name&order=id.asc");
  $("f-sel").innerHTML=fs.map(f=>'<option value="'+f.id+'">'+f.id+" "+f.name+'</option>').join("");
  const dp=await tbl("product?select=id,name&facility_id=eq.F11&order=id.asc");
  $("d-win").innerHTML=dp.filter(p=>p.name.includes("ダービー")).map(p=>'<option value="'+p.id+'">'+p.name.replace("ダービー投票券","勝者:")+'</option>').join("");
  doTick(); tick=setInterval(doTick,4000);
  loadDash();
}
async function doTick(){
  try{
    const r=await rpc("rpc_tick",{p_key:KEY});
    const defs=await loadPhaseDefs(); EV=null; const ev=await loadEvent();
    const c=calcPhase(ev,defs);
    $("hph").innerHTML=c.ph.label+"<br>"+remainStr(c.remain);
    $("openBtn").style.display = ev.opened_at? "none":"block";
    $("paperBtn").textContent = ev.paper_mode? "📄 紙モード解除(アプリ決済を再開)":"📄 紙モードにする(アプリ決済を停止)";
    $("dash").innerHTML =
      '<div class="kv"><span>フェーズ</span><b>'+c.ph.label+(ev.paused_at?" ⏸一時停止中":"")+'</b></div>'+
      '<div class="kv"><span>次まで</span><b>'+(remainStr(c.remain)||"—")+'</b></div>'+
      '<div class="kv"><span>経過</span><b>'+Math.max(0,Math.floor(c.elapsed))+'分 ／ 150分</b></div>'+
      '<div class="kv"><span>出席</span><b>'+r.attendees+'人</b></div>'+
      '<div class="kv"><span>国庫</span><b class="amt" style="color:'+(r.treasuryWarn?"var(--ac)":"#111")+'">'+fmt(r.treasury)+(r.treasuryWarn?" ⚠️":"")+'</b></div>';
    $("rushBox").innerHTML = r.rush?
      '<b style="color:var(--ac)">🔥 '+r.rush.name+' 進行中</b><p class="note">目標 '+r.rush.target+'組(部分達成 '+r.rush.partial_target+'組)── ライブカウンターは大型画面(screen.html)に表示中</p>'
      : '<p class="note">事件はフェーズ到達で自動開始・自動終了します(手動操作は不要)。</p>';
  }catch(e){ $("hph").textContent="接続エラー"; }
}
async function loadDash(){
  try{
    const d=await rpc("rpc_gov_dash",{p_key:KEY});
    $("keysBox").innerHTML='<div class="kv"><span>銀行キー</span><b>'+d.keys.bank+'</b></div>'+
      d.facilities.map(f=>'<div class="kv"><span>'+f.name+'</span><b>'+f.key+'</b></div>').join("");
    renderPros(d.prosperity); renderAwards(d.awards);
  }catch(e){}
  setTimeout(loadDash,15000);
}
function renderPros(p){
  if(!p)return;
  $("prosBox").innerHTML='<b>国家繁栄度 '+p.total+' / 100</b>'+
   '<div class="gauge" style="margin:8px 0"><div style="width:'+p.total+'%"></div></div>'+
   '<div class="kv"><span>経済</span><b>'+p.economy+' /40</b></div>'+
   '<div class="kv"><span>国家危機</span><b>'+p.crisis+' /30</b></div>'+
   '<div class="kv"><span>団結</span><b>'+p.unity+' /30</b></div>'+
   '<p class="note">初期勤務'+p.detail.initDone+' ／ 自由勤務'+p.detail.freeWorkers+'人 ／ 購買'+p.detail.buyers+'人 ／ 取引'+p.detail.tx+'件 ／ チーム'+p.detail.teamDone+"/"+p.detail.teamTotal+'</p>';
}
function renderAwards(a){
  if(!a)return;
  $("awardsBox").innerHTML=Object.keys(AWARD_NAMES).map(k=>{
    const top=(a[k]&&a[k][0])||null;
    return '<div class="kv"><span>'+AWARD_NAMES[k]+'</span><b>'+(top? top.display_name+"("+fmt(top.v)+")":"—")+'</b></div>';
  }).join("");
}
async function openCountry(){
  if(!confirm("開国します。150分のタイマーが始まります。よろしいですか?"))return;
  try{ await rpc("rpc_gov_open",{p_key:KEY}); toast("🏛 開国しました!"); }catch(e){ toast(e.message,1); }
}
async function pause(p){ try{ await rpc("rpc_gov_pause",{p_key:KEY,p_pause:p}); toast(p?"⏸ 一時停止":"▶️ 再開"); doTick(); }catch(e){ toast(e.message,1); } }
async function jump(){ try{ await rpc("rpc_gov_jump",{p_key:KEY,p_phase:$("jump").value}); toast("移動しました"); doTick(); }catch(e){ toast(e.message,1); } }
async function shiftMin(m){ try{ await rpc("rpc_gov_shift",{p_key:KEY,p_min:m}); toast((m>0?"+":"")+m+"分"); doTick(); }catch(e){ toast(e.message,1); } }
async function paper(){ const ev=await loadEvent(); try{ await rpc("rpc_gov_paper",{p_key:KEY,p_on:!ev.paper_mode}); EV=null; toast("切り替えました"); doTick(); }catch(e){ toast(e.message,1); } }
async function mission(){ const n=parseInt($("mdone").value,10); if(isNaN(n))return toast("数を入力",1);
  try{ await rpc("rpc_gov_mission",{p_key:KEY,p_done:n}); toast("📝 記録しました"); }catch(e){ toast(e.message,1); } }
async function facSt(){ try{ await rpc("rpc_gov_facility",{p_key:KEY,p_fid:$("f-sel").value,p_status:$("f-st").value}); toast("適用しました"); }catch(e){ toast(e.message,1); } }
async function derbyOpen(){ try{ await rpc("rpc_derby_open",{p_key:KEY}); toast("🏇 馬券の発売を開始しました(全市民に出馬表が出ます)"); }catch(e){ toast(e.message,1); } }
async function derbyEntrants(){
  const names=["e1","e2","e3","e4","e5","e6"].map(id=>$(id).value.trim());
  try{ await rpc("rpc_derby_entrants",{p_key:KEY,p_names:names}); toast("出走馬を登録しました"); }catch(e){ toast(e.message,1); }
}
async function derbyRace(){
  try{ await rpc("rpc_derby_race",{p_key:KEY}); toast("🏇 発走!全市民のスマホに実況が出ます"); }catch(e){ toast(e.message,1); }
}
async function derbySettle(){
  if(!confirm("レース結果を確定して一括清算します。よろしいですか?"))return;
  try{ const r=await rpc("rpc_derby_settle",{p_key:KEY,p_winner_product:parseInt($("d-win").value,10),p_winner_citizen:$("d-citizen").value.trim()});
    toast("🏁 清算完了:的中"+r.winners+"人に計"+fmt(r.paid)+"コイン"); }catch(e){ toast(e.message,1); } }

async function loadRoster(){
  try{ ROSTER=await rpc("rpc_roster",{p_key:KEY})||[]; renderRoster(); toast("名簿 "+ROSTER.length+"人"); }
  catch(e){ toast(e.message,1); }
}
function renderRoster(){
  const q=($("r-q").value||"").trim();
  const rows=ROSTER.filter(r=>!q || (r.no+" "+r.name+" "+r.dept).includes(q));
  $("rosterTbl").innerHTML = rows.length?
    '<table class="tb"><tr><th>番号</th><th>名前</th><th>部署</th><th>組</th><th>初期</th><th>チーム</th><th>出欠</th><th>残高</th><th>PIN</th><th>操作</th></tr>'+
    rows.map(r=>'<tr><td><b>'+r.no+'</b></td><td>'+r.name+'</td><td>'+r.dept+'</td><td>'+(r.grp||"")+'</td><td>'+(r.fac||"")+'</td><td>'+(r.team||"")+'</td>'+
      '<td>'+(r.att==="present"?'<span class="tag red">出席</span>':(r.att==="absent"?'<span class="tag gray">欠席</span>':'<span class="tag">未</span>'))+'</td>'+
      '<td class="amt">'+fmt(r.balance)+'</td><td>'+(r.hasPin?"✅":"—")+'</td>'+
      '<td><button class="pill" onclick="att2(\''+r.no+'\',\'present\')">出席</button><button class="pill" onclick="att2(\''+r.no+'\',\'absent\')">欠席</button><button class="pill" onclick="pinreset(\''+r.no+'\')">PIN解除</button></td></tr>').join("")+"</table>"
    : '<p class="note">該当なし</p>';
}
async function att2(no,st){
  try{ await rpc("rpc_gov_attendance",{p_key:KEY,p_no:no,p_state:st}); toast(no+" → "+(st==="present"?"出席":"欠席")); loadRoster(); }
  catch(e){ toast(e.message,1); }
}
async function pinreset(no){
  if(!confirm(no+" のPINをリセットします(次回ログインで本人が再設定)。OK?"))return;
  try{ await rpc("rpc_gov_pinreset",{p_key:KEY,p_no:no}); toast("🔓 リセットしました"); loadRoster(); }
  catch(e){ toast(e.message,1); }
}
function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  const head=lines.shift().split(",").map(h=>h.trim());
  return lines.filter(Boolean).map(l=>{ const v=l.split(","); const o={}; head.forEach((h,i)=>o[h]=(v[i]||"").trim()); return o; });
}
async function importCSV(){
  let rows; try{ rows=parseCSV($("csv").value); }catch(e){ return toast("CSVを読めません",1); }
  rows=rows.filter(r=>(r.kind||"citizen")!=="staff");
  if(!rows.length) return toast("市民の行がありません",1);
  if(!confirm(rows.length+"人を取り込みます。よろしいですか?"))return;
  try{ const r=await rpc("rpc_import_roster",{p_key:KEY,p_rows:rows});
    toast("📥 "+r.imported+"人を取り込みました"); loadRoster();
  }catch(e){ toast(e.message,1); }
}
async function importDummy(){
  if(!confirm("試遊用のダミー148人を投入します。よろしいですか?"))return;
  const D=[["DH",53],["Lab",34],["Medical",28],["Growth",11],["Tech",7],["CS",5],["Global",4],["Sales",3],["HR",2],["経営",1]];
  const SN=["佐藤","鈴木","高橋","田中","伊藤","渡辺","山本","中村","小林","加藤","吉田","山田","松本","井上","木村"];
  const GN=["陽菜","蓮","結衣","大翔","葵","悠真","凛","湊","紬","樹","杏","颯","芽依","朝陽","咲良"];
  const rows=[]; let i=0;
  D.forEach(d=>{ for(let k=0;k<d[1];k++){ const nm=SN[i%15]+GN[(i*7)%15]; rows.push({name:nm,display_name:nm,slack:"@u"+(101+i),department:d[0]}); i++; } });
  try{ const r=await rpc("rpc_import_roster",{p_key:KEY,p_rows:rows});
    toast("🧪 ダミー"+r.imported+"人を投入しました"); loadRoster();
  }catch(e){ toast(e.message,1); }
}
(()=>{ const s=loadS("ohk_g"); if(s){ KEY=s.k; enter(); } })();
</script>
</body></html>
