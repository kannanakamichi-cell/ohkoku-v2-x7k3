<!DOCTYPE html>
<html lang="ja"><head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Oh!国 政府</title>
<link rel="stylesheet" href="ohk.css">
</head><body>
<header><div class="ttl"><i>!</i> 政府</div><div class="ph" id="hph">—</div></header>
<main>

<section class="screen on" id="s-login">
  <div class="card">
    <h3>政府キーでログイン</h3>
    <input id="l-key" placeholder="gov-xxxxxx" autocapitalize="off">
    <button class="btn pri" onclick="login()">🏛 政府端末を開く</button>
    <p class="note">⚠️ この画面が国の進行エンジンです。イベント中は必ず1台で開きっぱなしにしてください(フェーズ切替・給与自動振込・市場開閉・事件の開始終了はこの端末が動かします)。</p>
  </div>
</section>

<section class="screen" id="s-main">
  <div class="card" id="dash"></div>

  <h2 class="sec">進行</h2>
  <div class="card">
    <button class="btn pri" id="openBtn" onclick="openCountry()">🏛 開国する(タイマー始動)</button>
    <div class="row">
      <button class="btn dark" onclick="pause(true)">⏸ 一時停止</button>
      <button class="btn ghost" onclick="pause(false)">▶️ 再開</button>
    </div>
    <label>フェーズへジャンプ</label>
    <div class="row">
      <select id="jump"></select>
      <button class="btn mini dark" style="margin:0;padding:12px" onclick="jump()">移動</button>
    </div>
    <div class="row">
      <button class="btn ghost" onclick="shiftMin(-1)">−1分</button>
      <button class="btn ghost" onclick="shiftMin(1)">＋1分</button>
      <button class="btn ghost" onclick="shiftMin(5)">＋5分</button>
    </div>
    <button class="btn ghost" id="paperBtn" onclick="paper()">📄 紙モード切替</button>
  </div>

  <h2 class="sec">国家事件・最終ミッション</h2>
  <div class="card">
    <div id="rushBox"><p class="note">事件はフェーズ到達で自動開始・自動終了します。</p></div>
    <label>最終ミッション:達成チーム数</label>
    <div class="row">
      <input id="mdone" inputmode="numeric" placeholder="達成チーム数">
      <button class="btn mini dark" style="margin:0;padding:12px" onclick="mission()">記録</button>
    </div>
  </div>

  <h2 class="sec">🏇 ダービー(F11)</h2>
  <div class="card">
    <button class="btn dark" onclick="derbyOpen()">投票券の販売を開始(A〜F解禁)</button>
    <label>勝った馬(投票券)</label>
    <select id="d-win"></select>
    <label>優勝者(市民番号・賞金1,000)</label>
    <input id="d-citizen" inputmode="numeric" placeholder="101">
    <button class="btn pri" onclick="derbySettle()">🏁 レース確定・一括清算(的中3倍)</button>
  </div>

  <h2 class="sec">出欠・店舗</h2>
  <div class="card">
    <div class="row">
      <input id="a-no" inputmode="numeric" placeholder="市民番号">
      <button class="btn mini dark" style="margin:0;padding:12px" onclick="att('present')">出席</button>
      <button class="btn mini ghost" style="margin:0;padding:12px" onclick="att('absent')">欠席</button>
    </div>
    <label>店舗の強制ステータス</label>
    <div class="row">
      <select id="f-sel"></select>
      <select id="f-st"><option value="AUTO">自動</option><option value="OPEN">強制OPEN</option><option value="CLOSED">強制CLOSED</option></select>
      <button class="btn mini dark" style="margin:0;padding:12px" onclick="facSt()">適用</button>
    </div>
  </div>

  <h2 class="sec">名簿</h2>
  <div class="card">
    <label>CSV貼り付け(name,display_name,slack,department,role,kind,team)</label>
    <textarea id="csv" rows="4" placeholder="ここにCSVを貼る(kind=staffの行は自動で除外)"></textarea>
    <button class="btn dark" onclick="importCSV()">📥 名簿を取り込む(市民番号101〜自動付与+人生ガチャ)</button>
    <button class="btn ghost" onclick="importDummy()">🧪 ダミー148人を投入(試遊用)</button>
    <div class="row">
      <input id="pr-no" inputmode="numeric" placeholder="PINリセットする番号">
      <button class="btn mini ghost" style="margin:0;padding:12px" onclick="pinreset()">PINリセット</button>
    </div>
    <div id="rosterBox" class="note">—</div>
  </div>

  <h2 class="sec">繁栄度・表彰</h2>
  <div class="card" id="prosBox">—</div>
  <div class="card" id="awardsBox">—</div>

  <h2 class="sec">キー一覧(スタッフ配布用)</h2>
  <div class="card" id="keysBox">—</div>
  <button class="btn ghost" onclick="clearS('ohk_g');location.reload()">退出</button>
</section>

</main>
<div id="toast"></div>
<script src="ohk.js"></script>
<script>
let KEY=null, tick=null;
const AWARD_NAMES={richest:"👑 総資産",riser:"🚀 成り上がり",investor:"📈 投資家",spender:"🛍 消費王",worker:"💪 働き者",popular:"🤝 人気者"};

async function login(){
  const k=$("l-key").value.trim(); if(!k) return toast("政府キーを入力",1);
  try{ await rpc("rpc_tick",{p_key:k}); KEY=k; saveS("ohk_g",{k}); enter(); }
  catch(e){ toast(e.message,1); }
}
async function enter(){
  $("s-login").classList.remove("on"); $("s-main").classList.add("on");
  const defs=await loadPhaseDefs();
  $("jump").innerHTML=defs.filter(d=>d.id!=="SETUP").map(d=>'<option value="'+d.id+'">'+d.label+"("+d.start_min+"分)</option>").join("");
  const fs=await tbl("facility?select=id,name&order=id.asc");
  $("f-sel").innerHTML=fs.map(f=>'<option value="'+f.id+'">'+f.name+'</option>').join("");
  const dp=await tbl("product?select=id,name&facility_id=eq.F11&order=id.asc");
  $("d-win").innerHTML=dp.filter(p=>p.name.includes("ダービー")).map(p=>'<option value="'+p.id+'">'+p.name+'</option>').join("");
  doTick(); tick=setInterval(doTick,4000);
  loadDash();
}
async function doTick(){
  try{
    const r=await rpc("rpc_tick",{p_key:KEY});
    const defs=await loadPhaseDefs(); EV=null; const ev=await loadEvent();
    const c=calcPhase(ev,defs);
    $("hph").innerHTML=c.ph.label+"<br>"+remainStr(c.remain);
    $("openBtn").style.display = ev.opened_at? "none":"block";
    $("paperBtn").textContent = ev.paper_mode? "📄 紙モード解除(アプリ決済を再開)":"📄 紙モードにする(アプリ決済を停止)";
    $("dash").innerHTML =
      '<div class="kv"><span>フェーズ</span><b>'+c.ph.label+(ev.paused_at?" ⏸一時停止中":"")+'</b></div>'+
      '<div class="kv"><span>経過</span><b>'+Math.max(0,Math.floor(c.elapsed))+'分 ／ 150分</b></div>'+
      '<div class="kv"><span>出席</span><b>'+r.attendees+'人</b></div>'+
      '<div class="kv"><span>国庫</span><b class="amt" style="color:'+(r.treasuryWarn?"var(--ac)":"#111")+'">'+fmt(r.treasury)+(r.treasuryWarn?" ⚠️残り2割":"")+'</b></div>';
    $("rushBox").innerHTML = r.rush?
      '<b>🔥 '+r.rush.name+' 進行中</b><p class="note">目標 '+r.rush.target+'組(部分達成 '+r.rush.partial_target+')。カウンターは大型画面に表示中</p>'
      : '<p class="note">事件はフェーズ到達で自動開始・自動終了します。</p>';
  }catch(e){ $("hph").textContent="接続エラー"; }
}
async function loadDash(){
  try{
    const d=await rpc("rpc_gov_dash",{p_key:KEY});
    $("keysBox").innerHTML='<div class="kv"><span>銀行キー</span><b>'+d.keys.bank+'</b></div>'+
      d.facilities.map(f=>'<div class="kv"><span>'+f.name+'</span><b>'+f.key+'</b></div>').join("");
    renderPros(d.prosperity); renderAwards(d.awards);
    $("rosterBox").textContent="登録 "+d.participants+"人 ／ 出席 "+d.present+"人";
  }catch(e){}
  setTimeout(loadDash,15000);
}
function renderPros(p){
  if(!p)return;
  $("prosBox").innerHTML='<b>国家繁栄度 '+p.total+' / 100</b>'+
   '<div class="gauge" style="margin:8px 0"><div style="width:'+p.total+'%"></div></div>'+
   '<div class="kv"><span>経済</span><b>'+p.economy+' /40</b></div>'+
   '<div class="kv"><span>国家危機</span><b>'+p.crisis+' /30</b></div>'+
   '<div class="kv"><span>団結</span><b>'+p.unity+' /30</b></div>'+
   '<p class="note">勤務'+p.detail.initDone+'完了 ／ 自由勤務'+p.detail.freeWorkers+'人 ／ 購買'+p.detail.buyers+'人 ／ 取引'+p.detail.tx+'件 ／ チーム'+p.detail.teamDone+"/"+p.detail.teamTotal+'</p>';
}
function renderAwards(a){
  if(!a)return;
  $("awardsBox").innerHTML=Object.keys(AWARD_NAMES).map(k=>{
    const top=(a[k]&&a[k][0])||null;
    return '<div class="kv"><span>'+AWARD_NAMES[k]+'</span><b>'+(top? top.display_name+"("+fmt(top.v)+")":"—")+'</b></div>';
  }).join("");
}
async function openCountry(){
  if(!confirm("開国します。150分のタイマーが始まります。よろしいですか?"))return;
  try{ await rpc("rpc_gov_open",{p_key:KEY}); toast("🏛 開国しました!"); }catch(e){ toast(e.message,1); }
}
async function pause(p){ try{ await rpc("rpc_gov_pause",{p_key:KEY,p_pause:p}); toast(p?"⏸ 一時停止":"▶️ 再開"); doTick(); }catch(e){ toast(e.message,1); } }
async function jump(){ try{ await rpc("rpc_gov_jump",{p_key:KEY,p_phase:$("jump").value}); toast("移動しました"); doTick(); }catch(e){ toast(e.message,1); } }
async function shiftMin(m){ try{ await rpc("rpc_gov_shift",{p_key:KEY,p_min:m}); toast((m>0?"+":"")+m+"分"); doTick(); }catch(e){ toast(e.message,1); } }
async function paper(){ const ev=await loadEvent(); try{ await rpc("rpc_gov_paper",{p_key:KEY,p_on:!ev.paper_mode}); EV=null; toast("切り替えました"); doTick(); }catch(e){ toast(e.message,1); } }
async function mission(){ const n=parseInt($("mdone").value,10); if(isNaN(n))return toast("数を入力",1);
  try{ await rpc("rpc_gov_mission",{p_key:KEY,p_done:n}); toast("📝 記録しました"); loadDash(); }catch(e){ toast(e.message,1); } }
async function att(st){ const no=$("a-no").value.trim(); if(!no)return toast("番号を入力",1);
  try{ await rpc("rpc_gov_attendance",{p_key:KEY,p_no:no,p_state:st}); toast(no+" を"+(st==="present"?"出席":"欠席")+"に"); }catch(e){ toast(e.message,1); } }
async function facSt(){ try{ await rpc("rpc_gov_facility",{p_key:KEY,p_fid:$("f-sel").value,p_status:$("f-st").value}); toast("適用しました"); }catch(e){ toast(e.message,1); } }
async function derbyOpen(){ try{ await rpc("rpc_derby_open",{p_key:KEY}); toast("🏇 投票券の販売を開始しました"); }catch(e){ toast(e.message,1); } }
async function derbySettle(){
  if(!confirm("レース結果を確定して一括清算します。よろしいですか?"))return;
  try{ const r=await rpc("rpc_derby_settle",{p_key:KEY,p_winner_product:parseInt($("d-win").value,10),p_winner_citizen:$("d-citizen").value.trim()});
    toast("🏁 清算完了:的中"+r.winners+"人に計"+fmt(r.paid)+"コイン"); }catch(e){ toast(e.message,1); } }
async function pinreset(){ const no=$("pr-no").value.trim(); if(!no)return toast("番号を入力",1);
  try{ await rpc("rpc_gov_pinreset",{p_key:KEY,p_no:no}); toast("🔓 "+no+" のPINをリセット(次回ログインで再設定)"); }
  catch(e){ toast("この機能には追加SQLが必要です:"+e.message,1); } }

function parseCSV(text){
  const lines=text.replace(/^\uFEFF/,"").trim().split(/\r?\n/);
  const head=lines.shift().split(",").map(h=>h.trim());
  return lines.filter(Boolean).map(l=>{ const v=l.split(","); const o={}; head.forEach((h,i)=>o[h]=(v[i]||"").trim()); return o; });
}
async function importCSV(){
  let rows; try{ rows=parseCSV($("csv").value); }catch(e){ return toast("CSVを読めません",1); }
  rows=rows.filter(r=>(r.kind||"citizen")!=="staff");
  if(!rows.length) return toast("市民の行がありません",1);
  if(!confirm(rows.length+"人を取り込みます。よろしいですか?"))return;
  try{ const r=await rpc("rpc_import_roster",{p_key:KEY,p_rows:rows});
    toast("📥 "+r.imported+"人を取り込みました(番号101〜)"); loadDash();
  }catch(e){ toast(e.message,1); }
}
async function importDummy(){
  if(!confirm("試遊用のダミー148人を投入します。よろしいですか?"))return;
  const D=[["DH",53],["Lab",34],["Medical",28],["Growth",11],["Tech",7],["CS",5],["Global",4],["Sales",3],["HR",2],["経営",1]];
  const SN=["佐藤","鈴木","高橋","田中","伊藤","渡辺","山本","中村","小林","加藤","吉田","山田","松本","井上","木村"];
  const GN=["陽菜","蓮","結衣","大翔","葵","悠真","凛","湊","紬","樹","杏","颯","芽依","朝陽","咲良"];
  const rows=[]; let i=0;
  D.forEach(([dep,n])=>{ for(let k=0;k<n;k++){ const nm=SN[i%15]+GN[(i*7)%15]; rows.push({name:nm,display_name:nm,slack:"@u"+(101+i),department:dep}); i++; } });
  try{ const r=await rpc("rpc_import_roster",{p_key:KEY,p_rows:rows});
    toast("🧪 ダミー"+r.imported+"人を投入しました"); loadDash();
  }catch(e){ toast(e.message,1); }
}
(()=>{ const s=loadS("ohk_g"); if(s){ KEY=s.k; enter(); } })();
</script>
</body></html>
